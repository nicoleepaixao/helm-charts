name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Lint and render all charts
        run: ./scripts/test-charts.sh
