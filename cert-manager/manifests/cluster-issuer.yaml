apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    # Let's Encrypt production endpoint
    server: https://acme-v02.api.letsencrypt.org/directory
    # Replace with your email for certificate expiry notifications
    email: "admin@example.com"
    privateKeySecretRef:
      name: letsencrypt-production-key
    solvers:
      # DNS01 challenge via AWS Route53
      - dns01:
          route53:
            # Replace with your Route53 hosted zone ID
            hostedZoneID: "Z0XXXXXXXXXXXXX"
            # Replace with the AWS region of your Route53 hosted zone
            region: "us-east-1"
