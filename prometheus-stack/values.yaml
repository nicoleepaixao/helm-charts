# Production values for kube-prometheus-stack
# Install: helm dependency update && helm install prometheus-stack . -n monitoring --create-namespace

kube-prometheus-stack:

  # Enable default PrometheusRule resources for common alerts
  defaultRules:
    create: true

  prometheus:
    prometheusSpec:
      # Data retention period
      retention: 15d

      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi

      # Persistent storage for metrics data
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi

  grafana:
    enabled: true
    # Admin credentials come from a Secret created outside Git, e.g.:
    #   kubectl create secret generic grafana-admin -n monitoring \
    #     --from-literal=admin-user=admin --from-literal=admin-password="$(openssl rand -base64 24)"
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    # Not exposed: reach it with kubectl port-forward or put it behind an authenticated Ingress
    service:
      type: ClusterIP
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: gp3

  alertmanager:
    enabled: true
    alertmanagerSpec:
      secrets:
        - alertmanager-slack
    config:
      # Slack alerting — replace webhook URL and channel
      route:
        receiver: slack
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
      receivers:
        - name: slack
          slack_configs:
            # The webhook is a credential: it is read from a Secret mounted by alertmanagerSpec.secrets
            #   kubectl create secret generic alertmanager-slack -n monitoring --from-literal=webhook-url=<URL>
            - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
              channel: "#alerts"
              send_resolved: true
