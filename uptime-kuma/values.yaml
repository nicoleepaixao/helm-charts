# Production values for Uptime Kuma — self-hosted availability monitoring
# Install: helm dependency update && helm install uptime-kuma . -n uptime-kuma --create-namespace
#
# Monitors external availability of services (HTTP, TCP, DNS, ping).
# Provides public status pages and notifications to Slack, Discord, Email, and more.
# Complements Prometheus which monitors internal cluster metrics — Uptime Kuma
# checks services from the outside, the way your users experience them.

uptime-kuma:

  # Persistent storage for monitoring data and configuration
  persistence:
    enabled: true
    size: 5Gi
    storageClass: gp3

  service:
    type: ClusterIP

  # Ingress — expose the dashboard externally via NGINX ingress + TLS
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: letsencrypt-prod    # CHANGE: match your ClusterIssuer name
    hosts:
      - host: status.example.com                          # CHANGE: your domain
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: uptime-kuma-tls
        hosts:
          - status.example.com                            # CHANGE: your domain
