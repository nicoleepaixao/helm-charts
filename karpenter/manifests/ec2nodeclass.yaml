apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # Amazon Linux 2023 as the node operating system
  amiSelectorTerms:
    - alias: al2023@latest
  # Discover private subnets by the karpenter.sh/discovery tag
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "CLUSTER_NAME"  # Replace with your EKS cluster name
  # Discover security groups by the karpenter.sh/discovery tag
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "CLUSTER_NAME"  # Replace with your EKS cluster name
  # Role for the instance profile used by Karpenter nodes
  role: "KarpenterNodeRole-CLUSTER_NAME"  # Replace with your Karpenter node IAM role name
