apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      # Reference to the EC2NodeClass that defines launch configuration
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        # Allow both on-demand and spot instances for cost optimization
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]
        # Restrict to compute, general-purpose, and memory-optimized families
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c", "m", "r"]
        # Only AMD64 architecture
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
  limits:
    # Maximum total vCPUs across all nodes in this pool
    cpu: "100"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
